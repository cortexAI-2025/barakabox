<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1242 2688" width="1242" height="2688">
  <!-- Splash screen — deep green background, centered logo + tagline -->
  <rect width="1242" height="2688" fill="#1A5C35"/>

  <!-- Subtle radial glow behind logo -->
  <radialGradient id="glow" cx="50%" cy="44%" r="35%">
    <stop offset="0%" stop-color="#236B40" stop-opacity="1"/>
    <stop offset="100%" stop-color="#1A5C35" stop-opacity="0"/>
  </radialGradient>
  <rect width="1242" height="2688" fill="url(#glow)"/>

  <!-- === LOGO GROUP (centered at 621, 1150) === -->
  <g transform="translate(621, 1100)">

    <!-- Hand (white) -->
    <path d="M0 290
      C-120 290 -230 254 -296 208
      C-332 182 -346 150 -340 122
      C-334 94 -312 76 -280 71
      C-258 67 -234 74 -214 88
      L-214 -60
      C-214 -82 -196 -100 -174 -100
      C-152 -100 -134 -82 -134 -60
      L-134 -94
      C-134 -116 -116 -134 -94 -134
      C-72 -134 -54 -116 -54 -94
      L-54 -108
      C-54 -130 -36 -148 -14 -148
      C8 -148 26 -130 26 -108
      L26 -114
      C26 -136 44 -154 66 -154
      C88 -154 106 -136 106 -114
      L106 88
      C126 72 150 65 172 70
      C202 75 222 93 228 121
      C234 149 220 182 184 208
      C118 254 110 290 0 290Z"
      fill="white" opacity="0.95"/>

    <!-- Box body -->
    <rect x="-130" y="-310" width="260" height="188" rx="16" fill="#F9C532"/>
    <!-- Box lid -->
    <rect x="-148" y="-336" width="296" height="44" rx="12" fill="#D4A020"/>
    <!-- Vertical stripe -->
    <rect x="-16" y="-310" width="32" height="188" fill="#D4A020" opacity="0.45"/>
    <!-- Lid stripe -->
    <rect x="-16" y="-336" width="32" height="44" fill="#B08010" opacity="0.5"/>
    <!-- Heart -->
    <path d="M0 -148
      C0 -148 -46 -176 -46 -204
      C-46 -220 -34 -232 -20 -232
      C-10 -232 0 -222 0 -222
      C0 -222 10 -232 20 -232
      C34 -232 46 -220 46 -204
      C46 -176 0 -148 0 -148Z"
      fill="white" opacity="0.92"/>

    <!-- Sparkles -->
    <!-- Main sparkle top-center -->
    <path d="M0 -400 L10 -368 L44 -358 L10 -348 L0 -316 L-10 -348 L-44 -358 L-10 -368 Z"
      fill="#F9C532"/>
    <!-- Left sparkle -->
    <path d="M-120 -374 L-114 -356 L-96 -350 L-114 -344 L-120 -326 L-126 -344 L-144 -350 L-126 -356 Z"
      fill="#F9C532" opacity="0.85"/>
    <!-- Right sparkle -->
    <path d="M120 -374 L126 -356 L144 -350 L126 -344 L120 -326 L114 -344 L96 -350 L114 -356 Z"
      fill="#F9C532" opacity="0.85"/>
    <!-- Tiny dots -->
    <circle cx="-192" cy="-340" r="8" fill="#F9C532" opacity="0.45"/>
    <circle cx="192" cy="-340" r="8" fill="#F9C532" opacity="0.45"/>
  </g>

  <!-- BARAKA -->
  <text x="621" y="1540"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="128" font-weight="900"
    text-anchor="middle" letter-spacing="8"
    fill="white">BARAKA</text>

  <!-- BOX -->
  <text x="621" y="1666"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="128" font-weight="900"
    text-anchor="middle" letter-spacing="12"
    fill="#F9C532">BOX</text>

  <!-- Decorative dots around BOX (like in logo) -->
  <circle cx="388" cy="1630" r="10" fill="#F9C532" opacity="0.7"/>
  <circle cx="854" cy="1630" r="10" fill="#F9C532" opacity="0.7"/>

  <!-- Tagline -->
  <text x="621" y="1740"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="44" font-style="italic"
    text-anchor="middle"
    fill="white" opacity="0.75">Mange mieux. Paye moins. Sauve plus.</text>
</svg>
