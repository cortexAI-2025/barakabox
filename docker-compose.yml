version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: barakabox-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: barakabox
      POSTGRES_USER: ${DB_USER:-baraka}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-barakapass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-baraka}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: barakabox-api
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-baraka}:${DB_PASSWORD:-barakapass}@postgres:5432/barakabox
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /tmp/uploads:/tmp/uploads

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: barakabox-admin
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:3000/api/v1
    depends_on:
      - backend

volumes:
  pgdata:

networks:
  default:
    name: barakabox-network
