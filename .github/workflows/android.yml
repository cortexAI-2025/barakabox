name: Build Android APK

on:
  push:
    branches: [ "main", "claude/baraka-box-mvp-BCwZp" ]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode'
        required: true
        default: 'quick'
        type: choice
        options: [ quick, production, store ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Node + Expo prebuild (génère mobile/android/) ─────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        working-directory: mobile
        run: npm install

      - name: Expo prebuild
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install 2>&1

      # Force JS bundling inside the APK (sinon "Unable to load script" au lancement)
      - name: Bundle JS into APK assets
        working-directory: mobile
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file node_modules/expo/AppEntry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            2>&1

      # ── Java 17 + Gradle (même config que MobixBuild) ─────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          build-root-directory: mobile/android
          cache-read-only: false

      - name: Regenerate wrapper JAR
        working-directory: mobile/android
        run: |
          gradle wrapper --gradle-version 8.6 --no-validate-url
          chmod +x gradlew

      - name: Clean Gradle cache
        working-directory: mobile/android
        run: gradle clean --no-daemon

      # ── Quick (debug APK) ─────────────────────────────────────────────────
      - name: Build debug APK
        if: ${{ github.event.inputs.mode == 'quick' || github.event.inputs.mode == '' }}
        working-directory: mobile/android
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m" \
            2>&1 | tee /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      # ── Production (signed release APK) ───────────────────────────────────
      - name: Generate CI keystore
        if: ${{ github.event.inputs.mode == 'production' || github.event.inputs.mode == 'store' }}
        run: |
          keytool -genkeypair \
            -keystore mobile/android/app/ci.keystore \
            -alias release -keyalg RSA -keysize 2048 -validity 365 \
            -storepass ci_password -keypass ci_password \
            -dname "CN=BarakaBox, OU=Build, O=BarakaBox, L=Casablanca, ST=MA, C=MA" \
            -noprompt

      - name: Build signed release APK
        if: ${{ github.event.inputs.mode == 'production' }}
        working-directory: mobile/android
        run: |
          gradle assembleRelease \
            --no-daemon \
            --stacktrace \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m" \
            "-Pandroid.injected.signing.store.file=${GITHUB_WORKSPACE}/mobile/android/app/ci.keystore" \
            "-Pandroid.injected.signing.store.password=ci_password" \
            "-Pandroid.injected.signing.key.alias=release" \
            "-Pandroid.injected.signing.key.password=ci_password" \
            2>&1 | tee /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      # ── Store (AAB) ───────────────────────────────────────────────────────
      - name: Build release AAB
        if: ${{ github.event.inputs.mode == 'store' }}
        working-directory: mobile/android
        run: |
          gradle bundleRelease \
            --no-daemon \
            --stacktrace \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m" \
            "-Pandroid.injected.signing.store.file=${GITHUB_WORKSPACE}/mobile/android/app/ci.keystore" \
            "-Pandroid.injected.signing.store.password=ci_password" \
            "-Pandroid.injected.signing.key.alias=release" \
            "-Pandroid.injected.signing.key.password=ci_password" \
            2>&1 | tee /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      # ── Diagnostic en cas d'échec ─────────────────────────────────────────
      - name: Extract real error on failure
        if: failure()
        run: |
          echo "════════ CAUSE RÉELLE ════════"
          grep -A 10 "Caused by:" /tmp/gradle-build.log | head -60 || true
          echo "════════ WHAT WENT WRONG ════════"
          grep -A 10 "What went wrong" /tmp/gradle-build.log | head -40 || true

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: barakabox-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
